services:
  api:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auradrop
      POSTGRES_USER: auradrop
      POSTGRES_PASSWORD: auradrop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auradrop -d auradrop"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
